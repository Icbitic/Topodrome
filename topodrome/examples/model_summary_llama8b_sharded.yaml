source_dir: .
entrypoint: model_summary.py
model:
  repo_id: meta-llama/Meta-Llama-3-8B-Instruct
  parallelism:
    mode: model_sharded
    degree: 2
    engine: transformers_device_map
    strategy: balanced
    max_memory_gb_per_gpu: 12
resources:
  gpu: 2
  min_vram_gb: 12
kwargs:
  label: llama-8b-two-gpu-sharding-demo
required_outputs:
  - model-summary.json
retry:
  max_attempts: 2
