# Install as /root/autodl-fs/topodrome/secrets/rclone.conf with mode 0600.
# The Lab1 authorized key should force the storage-only command documented in
# README.md, rooting this named remote at the scheduler's exact global_root.
[lab1-global]
type = sftp
host = 111.127.53.162
user = xiangkun
port = 2201
key_file = /root/autodl-fs/topodrome/secrets/storage_rsa
known_hosts_file = /root/autodl-fs/topodrome/secrets/lab1_known_hosts
shell_type = none
disable_hashcheck = true
