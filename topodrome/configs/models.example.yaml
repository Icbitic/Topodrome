        # Calibrate accepted-to-ready time for this exact site/model pair.
        estimated_startup_seconds: 2
      remote-jupyter-1:
        path: /mnt/model/ckpts/Meta-Llama-3-8B-Instruct
        revision_manifest: /absolute/operator-owned/model-revisions/meta-llama-3-8b-instruct.json
        local_files_only: true
        estimated_startup_seconds: 120
      autodl:
        origin: meta-llama/Meta-Llama-3-8B-Instruct
        persistent_path: /root/autodl-fs/models/Meta-Llama-3-8B-Instruct
        local_path: /root/autodl-tmp/models/Meta-Llama-3-8B-Instruct
        endpoint: https://hf-mirror.com
        estimated_startup_seconds: 30
        exclude:
